name: SSM Daily Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".scan-trigger/**"
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 22 * * 1-5"

concurrency:
  group: ssm-daily-scan-v2
  cancel-in-progress: true

jobs:
  scan:
    # The full SEC scan exceeds ubuntu-slim's hard 15-minute job limit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - name: Run screener
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SSM_MARKET_PROVIDER: yfinance
          SSM_SEC_DISCOVERY_MODE: atom
        run: ssm scan --days 7 --out output
      - name: Preserve scan snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ssm-scan-${{ github.run_id }}
          path: output/
          retention-days: 7
      - name: Commit outputs
        run: |
          git config user.name "ssm-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/publish_outputs.py
