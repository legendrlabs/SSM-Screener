# Legacy repository archived for operations. The canonical scheduled scanner
# and public snapshots now run in legendrlabs/SSM-Screener-public-ver.
# Preserve manual dispatch for troubleshooting only; no automatic triggers.
name: SSM Legacy Scan (Manual Only)

on:
  workflow_dispatch:

concurrency:
  group: ssm-daily-scan-v2
  cancel-in-progress: true

jobs:
  scan:
    # The full SEC scan exceeds ubuntu-slim's hard 15-minute job limit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - name: Run screener
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SSM_MARKET_PROVIDER: yfinance
          SSM_SEC_DISCOVERY_MODE: atom
        run: ssm scan --days 7 --out output
      - name: Compare generalized rules on the full universe
        if: github.event_name == 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SSM_MARKET_PROVIDER: yfinance
          SSM_SEC_DISCOVERY_MODE: atom
        run: |
          git fetch --no-tags --depth=1 origin 82e674f480a350368bdda5d36d10786f2e962da9
          mkdir -p "$RUNNER_TEMP/ssm-baseline"
          git archive FETCH_HEAD ssm | tar -x -C "$RUNNER_TEMP/ssm-baseline"
          python scripts/audit_scan.py --baseline-source "$RUNNER_TEMP/ssm-baseline" --baseline-commit 82e674f480a350368bdda5d36d10786f2e962da9 --days 7 --out output
      - name: Preserve scan snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ssm-scan-${{ github.run_id }}
          path: output/
          retention-days: 7
      - name: Commit outputs
        run: |
          git config user.name "ssm-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/publish_outputs.py
