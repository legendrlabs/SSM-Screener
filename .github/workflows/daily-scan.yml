name: SSM Daily Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".scan-trigger/**"
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 22 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run screener
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'SSM-Screener/0.1 whtjddlfcjswo1-cloud@users.noreply.github.com' }}
          SSM_MARKET_PROVIDER: yfinance
        run: ssm scan --days 7 --out output
      - name: Commit outputs
        run: |
          git config user.name "ssm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f output/
          git diff --cached --quiet || git commit -m "chore: update SSM screening outputs"
          git push
