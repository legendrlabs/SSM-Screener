name: SSM Daily Scan
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 22 * * 1-5"
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - name: Run screener
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SSM_MARKET_PROVIDER: yfinance
        run: ssm scan --days 7 --out output
      - name: Commit outputs
        run: |
          git config user.name "ssm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: update SSM screening outputs"
          git push
